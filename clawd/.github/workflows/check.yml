name: Clawd checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run publication:check
      - run: npm run build
      - run: npm test
      - run: npm run test:integrations
      - run: npm run build:bridge && npm run build:service
      - run: npm run test:packaged
  workers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        package: [control-plane, composio-broker]
    defaults:
      run:
        working-directory: cloudflare/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: cloudflare/${{ matrix.package }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
