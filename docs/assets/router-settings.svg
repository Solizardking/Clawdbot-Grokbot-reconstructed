<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Clawd Bot routing overview</title>
<desc id="desc">Documentation illustration, not an application screenshot. Clawd Bot routes conversations through a native engine, a hosted gateway, or an optional compatible hop adapter.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101529"/><stop offset="1" stop-color="#25143b"/></linearGradient></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#f4efff}.muted{fill:#b9b4ce}.card{fill:#201b35;stroke:#776493}.line{fill:none;stroke:#a58aff;stroke-width:2}</style>
<rect width="1000" height="540" rx="20" fill="url(#bg)"/>
<text x="40" y="48" font-size="14" letter-spacing="3" class="muted">CLAWD BOT</text>
<text x="40" y="103" font-size="38" font-weight="700">Choose the route for your agent.</text>
<text x="40" y="140" font-size="17" class="muted">Model access, credentials, and tool support depend on the selected engine.</text>
<rect class="card" x="40" y="236" width="238" height="100" rx="14"/>
<circle cx="66" cy="267" r="5" fill="#72edc3"/>
<text x="84" y="273" font-size="20" font-weight="600">Clawd Bot</text>
<text x="60" y="308" font-size="15" class="muted">Agent conversation</text>
<path class="line" d="M278 286H365M365 225V411M365 225H425M365 318H425M365 411H425"/>
<g><rect class="card" x="425" y="186" width="535" height="78" rx="12"/>
<text x="447" y="216" font-size="20">Native engine</text>
<text x="447" y="243" font-size="15" class="muted">Supported CLI session or compatible provider driver</text>
<rect class="card" x="425" y="279" width="535" height="78" rx="12"/>
<text x="447" y="309" font-size="20">Hosted gateway</text>
<text x="447" y="336" font-size="15" class="muted">Account token · model grants · server-held provider keys</text>
<rect class="card" x="425" y="372" width="535" height="78" rx="12"/>
<text x="447" y="402" font-size="20">Optional hop adapter</text>
<text x="447" y="429" font-size="15" class="muted">Requires a compatible host consumer and verified routing</text></g>
<text x="40" y="501" font-size="14" class="muted">Documentation illustration · not an application screenshot or live service status</text>
</svg>
